id: running
version: 2
title: Running
families:
- temperature
- astronomy_geometry
- humidity
- wind
- precipitation
- air_quality
- radiation
- visibility
- hazard
- lightning
thresholds:
  lightning_in_range:
    field: lightning_strike
    default: 0.1
    units: flash km-2 min-1
    comparison: ge
  alert_active:
    field: alerts_in_force
    default: 1.0
    units: count
    comparison: ge
  heavy_precip:
    field: precipitation_rate
    default: 2.5
    units: mm h-1
    comparison: ge
  running_thermal_low_full:
    field: temperature_2m
    default: -27
    units: degC
    comparison: ge
  running_thermal_low_start:
    field: temperature_2m
    default: 0
    units: degC
    comparison: ge
  running_thermal_high_start:
    field: temperature_2m
    default: 20
    units: degC
    comparison: ge
  running_thermal_high_full:
    field: temperature_2m
    default: 30
    units: degC
    comparison: ge
  running_dew_point_start:
    field: dew_point_2m
    default: 15
    units: degC
    comparison: ge
  running_dew_point_full:
    field: dew_point_2m
    default: 24
    units: degC
    comparison: ge
  running_wind_start:
    field: wind_speed_10m
    default: 5.5
    units: m s-1
    comparison: ge
  running_wind_full:
    field: wind_speed_10m
    default: 10.8
    units: m s-1
    comparison: ge
  running_visibility_start:
    field: visibility
    default: 5000
    units: m
    comparison: le
  running_visibility_full:
    field: visibility
    default: 1000
    units: m
    comparison: le
weights:
  thermal: 0.35714285714285715
  dew_point: 0.35714285714285715
  wind: 0.14285714285714288
  visibility: 0.14285714285714288
hard_stops:
- name: lightning
  field: lightning_strike
  threshold: lightning_in_range
- name: alert
  field: alerts_in_force
  threshold: alert_active
- name: heavy_rain
  field: precipitation_rate
  threshold: heavy_precip
graded_criteria:
- name: thermal
  field: temperature_2m
  weight: thermal
  grade:
    curve: band
    parameters:
      low_full: running_thermal_low_full
      low_start: running_thermal_low_start
      high_start: running_thermal_high_start
      high_full: running_thermal_high_full
- name: dew_point
  field: dew_point_2m
  weight: dew_point
  grade:
    curve: linear
    parameters:
      start: running_dew_point_start
      full: running_dew_point_full
    comparison: ge
- name: wind
  field: wind_speed_10m
  weight: wind
  grade:
    curve: linear
    parameters:
      start: running_wind_start
      full: running_wind_full
    comparison: ge
- name: visibility
  field: visibility
  weight: visibility
  grade:
    curve: linear
    parameters:
      start: running_visibility_start
      full: running_visibility_full
    comparison: le
window:
  rule: any_window_within_24h
  geometry_entry: de442_sun_moon_geometry
  geometry_fields:
  - sun_altitude
  params:
    length_hours: 1.0
    daylight_only: false
site_needs:
  horizon_required: false
  sectors: []
blocked_fields:
- field: road_state
  reason: licence
  source_id: nl-511
  terms: The NL 511 site terms grant no reuse and the API needs a developer key
  request: null
wanted_not_catalogued:
- field: humidex
  note: the owner's list names humidex; the catalogue has no key for it
- field: wind_chill
  note: the owner's list names wind chill; the catalogue has no key for it
- field: uv_index
  note: the owner's list names UV; the catalogue has no key for it
intended_weights:
  thermal: 0.25
  dew_point: 0.25
  wind: 0.1
  visibility: 0.1
  shortwave: 0.1
  air_quality: 0.15
  gust: 0.05
admitted_paths:
  temperature_2m: &id001
  - eccc-hrdps
  - eccc-rdps
  - eccc-gdps
  - noaa-gfs
  dew_point_2m: *id001
  wind_speed_10m: *id001
  visibility:
  - noaa-gfs
admission_residuals:
- field: downward_shortwave_flux
  reason: No verified selected-time DSWRF path
  role: linear ge 300 to 900 W m-2
- field: pm2_5_surface
  reason: 'RAQDPS admission remains in #172; catalogue is not retrieval'
  role: linear ge 3e-8 to 1e-7 kg m-3
- field: wind_gust_10m
  reason: No admitted gust path in the selected gridded precedence
  role: linear ge 10.8 to 17.2 m s-1
- field: humidex_wind_chill_uv_aqhi
  reason: Replacement paths not admitted together; retain current thermal and dew-point
    proxies
  role: 'Replacement budget #64: humidex .37, wind chill .13, UV .10, AQHI .15, wind
    .10, gust .05, visibility .10'
- field: lightning_strike
  reason: No selected-time lightning-density query
  role: Retain unknown temporary hard stop
- field: alerts_in_force
  reason: CAP count covers Avalon boxes; no point-scoped generic alert mapping
  role: Retain unknown temporary hard stop
- field: precipitation_rate
  reason: Accumulation is not rain rate; no admitted rate path
  role: Retain unknown 2.5 mm h-1 hard stop
- field: humidex
  reason: Replacement path not admitted
  role: 'Producer-issued replacement: linear ge 30 to 45, intended weight .37'
- field: wind_chill
  reason: Replacement path not admitted
  role: 'Producer-issued replacement: linear le 0 to -27 degC, intended weight .13'
- field: uv_index
  reason: Replacement path not admitted
  role: 'Replacement: linear ge 3 to 8, intended weight .10'
- field: air_quality_health_index
  reason: Station AQHI does not establish the selected gridded replacement budget
  role: 'Replacement: linear ge 3 to 10, intended weight .15'
- field: wbgt_apparent_temperature_temperature_plus_dew_point
  reason: No base-profile grade; avoid duplicate thermal stress
  role: Context only
- field: pollen
  reason: 'No admitted pollen path; owner-declared gap in #64'
  role: Allergy variant gap
- field: road_running_winter_surface_coastal_route
  reason: Named variants not implemented; road_state remains blocked
  role: Variants only
- field: typed_dangerous_weather_freezing_precipitation_lightning_hold
  reason: Typed meanings, spatial extent and 30-minute hold not verified
  role: Future hard stops; no activation
coverage_floor: 0.6
saved_stack:
- id: eccc-lightning-lightning
  opacity: 0.85
- id: eccc-radar-radar
  opacity: 0.85
- id: eccc-cap-alerts-alerts_features
  opacity: 0.85
- id: eccc-raqdps-pm2_5_surface
  opacity: 0.85
- id: geomet-live-hrdps-pr
  opacity: 0.85
- id: geomet-live-hrdps-wspd
  opacity: 0.85
- id: geomet-live-hrdps-tt
  opacity: 0.85
- id: eccc-aqhi-demand-observations
  opacity: 0.85
