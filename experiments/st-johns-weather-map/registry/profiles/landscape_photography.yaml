id: landscape_photography
version: 2
title: Landscape photography
families:
- cloud_cover
- cloud_geometry
- visibility
- precipitation
- wind
- astronomy_geometry
- marine
thresholds:
  precip_block:
    field: precipitation_rate
    default: 2.5
    units: mm h-1
    comparison: ge
  landscape_photography_wind_start:
    field: wind_speed_10m
    default: 5.7
    units: m s-1
    comparison: ge
  landscape_photography_wind_full:
    field: wind_speed_10m
    default: 14.4
    units: m s-1
    comparison: ge
  landscape_photography_sun_low_full:
    field: sun_altitude
    default: -12
    units: degree
    comparison: ge
  landscape_photography_sun_low_start:
    field: sun_altitude
    default: -6
    units: degree
    comparison: ge
  landscape_photography_sun_high_start:
    field: sun_altitude
    default: 6
    units: degree
    comparison: ge
  landscape_photography_sun_high_full:
    field: sun_altitude
    default: 12
    units: degree
    comparison: ge
weights:
  wind: 0.5
  sun: 0.5
hard_stops:
- name: heavy_rain
  field: precipitation_rate
  threshold: precip_block
graded_criteria:
- name: wind
  field: wind_speed_10m
  weight: wind
  grade:
    curve: linear
    parameters:
      start: landscape_photography_wind_start
      full: landscape_photography_wind_full
    comparison: ge
- name: sun
  field: sun_altitude
  weight: sun
  grade:
    curve: band
    parameters:
      low_full: landscape_photography_sun_low_full
      low_start: landscape_photography_sun_low_start
      high_start: landscape_photography_sun_high_start
      high_full: landscape_photography_sun_high_full
window:
  rule: sunrise_sunset_margin
  geometry_entry: de442_sun_moon_geometry
  geometry_fields:
  - sun_altitude
  - sun_azimuth
  params:
    margin_minutes: 45.0
site_needs:
  horizon_required: true
  sectors:
  - name: sun_azimuth_cloud
    field: total_cloud_opacity
    width_deg: 40.0
    max_range_km: 100.0
    bearing_field: sun_azimuth
blocked_fields: []
wanted_not_catalogued: []
intended_weights:
  wind: 0.2
  sun: 0.2
  sun_sector_cloud: 0.6
admitted_paths:
  wind_speed_10m:
  - eccc-hrdps
  - eccc-rdps
  - eccc-gdps
  - noaa-gfs
  sun_altitude:
  - nasa-jpl-de442
admission_residuals:
- field: total_cloud_opacity
  reason: No served sector query or returned sun_azimuth; arbitrary points are no_site
  role: Sun-sector band outer 0/100, comfort 20/70 percent, low_cap 0.5
- field: precipitation_rate
  reason: No admitted rate path
  role: Retain unknown 2.5 mm h-1 hard stop
- field: significant_wave_height
  reason: Coastal variant and danger rules remain separate
  role: Context only
- field: cloud_top_height
  reason: Replacement budget not admitted together
  role: 'Replacement: linear le 6100 to 2000 m, weight .10'
- field: fog_closure
  reason: No admitted fog producer
  role: 'Replacement: linear ge .25 to .75, weight .10'
- field: visibility
  reason: Replacement budget waits for Sun-sector/height/fog paths
  role: 'Replacement: linear le 20000 to 1000 m, weight .20; Sun-sector cloud .35,
    wind .10, Sun altitude .15'
- field: coastal_seascape
  reason: Named variant not implemented
  role: Sea-state band comfort .5 to 2.5 m, full anchors 0 and 6 m; photographic subject
    only
- field: wave_surge_danger_lightning_hold
  reason: Site-specific wave/surge and spatial/temporal lightning contracts unverified
  role: Future hard stops; no activation
- field: layer_cloud_tide_swell_rainbow_crepuscular_ray_galactic_centre
  reason: Context/opportunities only where returned; no additional base-profile loss
  role: Named variants remain separate
coverage_floor: 0.6
saved_stack:
- id: eccc-hrdps-surface-total-cloud
  opacity: 0.85
- id: geomet-live-hrdps-weong-fog-liquid
  opacity: 0.85
- id: geomet-live-hrdps-pr
  opacity: 0.85
- id: geomet-live-hrdps-wspd
  opacity: 0.85
- id: geomet-live-goes-east-naturalcolor
  opacity: 0.85
