id: aurora
version: 2
title: Aurora
families:
- space_weather
- astronomy_geometry
- cloud_cover
- visibility
thresholds:
  aurora_kp_start:
    field: kp_index
    default: 5
    units: '1'
    comparison: le
  aurora_kp_full:
    field: kp_index
    default: 1
    units: '1'
    comparison: le
  aurora_moon_start:
    field: moon_illuminated_fraction
    default: 0.2
    units: '1'
    comparison: ge
  aurora_moon_full:
    field: moon_illuminated_fraction
    default: 1
    units: '1'
    comparison: ge
weights:
  kp: 0.7
  moon: 0.3
hard_stops: []
graded_criteria:
- name: kp
  field: kp_index
  weight: kp
  grade:
    curve: linear
    parameters:
      start: aurora_kp_start
      full: aurora_kp_full
    comparison: le
- name: moon
  field: moon_illuminated_fraction
  weight: moon
  grade:
    curve: linear
    parameters:
      start: aurora_moon_start
      full: aurora_moon_full
    comparison: ge
  applicability: moon_above_horizon
window:
  rule: dark_hours
  geometry_entry: de442_sun_moon_geometry
  geometry_fields:
  - sun_altitude
  - moon_altitude
  - moon_illuminated_fraction
  params: {}
site_needs:
  horizon_required: false
  sectors:
  - name: north_cloud
    field: cloud_high
    bearing_deg: 0.0
    width_deg: 60.0
    max_range_km: 150.0
blocked_fields:
- field: magnetometer_local_disturbance
  reason: partnership
  source_id: nrcan-stj-magnetometer
  terms: NRCan forbids redistribution without written permission
  request: Written permission requested from NRCan for the STJ magnetometer, 2026-09-02
wanted_not_catalogued: []
intended_weights:
  kp: 0.35
  moon: 0.15
  hp30: 0.15
  north_cloud: 0.35
admitted_paths:
  kp_index:
  - noaa-swpc-kp
  moon_illuminated_fraction:
  - nasa-jpl-de442
admission_residuals:
- field: hp30_index
  reason: No verified Hp30 selected-time path
  role: linear le 5 to 1
- field: cloud_high
  reason: No served north-sector query; arbitrary points are no_site
  role: north-sector linear ge 10 to 90 percent
- field: solar_wind_speed_bz_gsm
  reason: Planetary context remains in Sky; no local probability or latitude recalibration
  role: Context only, zero graded weight
- field: aacgm_latitude
  reason: No computed AACGM path or recalibration contract
  role: Future calibration evidence; no assumed one-level shift
- field: ovation_north_sector_probability
  reason: OVATION raster does not supply an admitted north-sector sample
  role: 'Replacement: linear le 50 to 5 percent, intended weight .40'
- field: moon_sky_brightening
  reason: No admitted derivation replacing illumination proxy
  role: Replacement weight .15
- field: north_cloud
  reason: No admitted sector query
  role: Replacement weight .25
- field: fog_closure
  reason: No admitted fog producer
  role: Replacement weight .15; fog grading curve awaits its producer/method contract
- field: distance_from_magnetic_midnight
  reason: No admitted magnetic-geometry path
  role: 'Replacement band: comfort within 2 hours, full loss at 5 hours; weight .05'
- field: newell_coupling_hemispheric_power_dst_symh_ae_forecasts_alerts
  reason: Supporting evidence only where returned; no local likelihood construction
  role: Context only, alongside Kp/Hp30/Bz/solar-wind speed and density
- field: north_total_cloud_opacity
  reason: Northern sector contract unavailable
  role: Future 90 percent overcast hard stop; no activation
coverage_floor: 0.6
saved_stack:
- id: noaa-gfs-demand-cloud-high
  opacity: 0.85
- id: eccc-hrdps-surface-total-cloud
  opacity: 0.85
- id: geomet-live-hrdps-weong-fog-liquid
  opacity: 0.85
- id: geomet-live-goes-east-snowfog-nightmicro
  opacity: 0.85
