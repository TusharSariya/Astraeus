# Quidi Vidi, lakeside at the boathouses on the west end of the lake. The
# lake runs away low to the east; ridges close in to the north and south, and
# the bulk of Signal Hill stands to the south-east.
id: quidi-vidi
name: Quidi Vidi Lake (boathouses)
note: >-
  The horizon elevation angles were hand-registered from map reading on
  2026-09-03 and await a field survey. They are read from contour and
  shoreline geometry, not measured on site, so each angle is good to about a
  degree and no better.
position:
  latitude: 47.5806
  longitude: -52.6867
elevation:
  metres: 5.0
  datum: CGVD2013
horizon:
  # 36 values, true north first, stepping 10 degrees clockwise. From 5 m at
  # the lakeside nothing is below level: the lake surface itself sits at
  # about 0.5 degrees of foreshore.
  bearing_resolution_deg: 10
  elevation_deg:
    - 8.0    # 0    the ridge north of the lake toward Newfoundland Drive
    - 8.0    # 10
    - 7.0    # 20
    - 6.0    # 30
    - 5.0    # 40
    - 4.0    # 50
    - 3.0    # 60
    - 2.0    # 70
    - 1.0    # 80
    - 0.5    # 90   due east, the lake running away low
    - 0.5    # 100
    - 1.5    # 110
    - 3.0    # 120
    - 4.0    # 130  Signal Hill, about 2.5 km off and 160 m above the lake
    - 4.5    # 140
    - 5.0    # 150
    - 7.0    # 160
    - 9.0    # 170
    - 11.0   # 180  the ridge south of the lake, close in above Forest Road
    - 12.0   # 190
    - 11.0   # 200
    - 9.0    # 210
    - 7.0    # 220
    - 6.0    # 230
    - 5.0    # 240
    - 4.5    # 250
    - 4.0    # 260
    - 4.0    # 270  due west, the city rising toward downtown
    - 4.0    # 280
    - 4.0    # 290
    - 4.5    # 300
    - 5.0    # 310
    - 6.0    # 320
    - 7.0    # 330
    - 7.5    # 340
    - 8.0    # 350
terrain_check:
  status: not_run
  dem: null
  tolerance_deg: 1.0
  terrain_elevation_deg: null
  note: >-
    No digital elevation model is available in the repository; the terrain
    check was not run and the terrain horizon is not assumed to agree.
registered:
  date: "2026-09-03"
  by: Tushar Sariya
