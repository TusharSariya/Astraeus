# Cape Spear, the lighthouse headland. Open Atlantic from the north-east
# round through east to the south; the only land is the headland behind,
# rising gently to the west.
id: cape-spear
name: Cape Spear (lighthouse headland)
note: >-
  The horizon elevation angles were hand-registered from map reading on
  2026-09-03 and await a field survey. They are read from contour and
  shoreline geometry, not measured on site, so each angle is good to about a
  degree and no better.
position:
  latitude: 47.5233
  longitude: -52.6224
elevation:
  metres: 75.0
  datum: CGVD2013
horizon:
  # 36 values, true north first, stepping 10 degrees clockwise. The open sea
  # sits at -0.5 because the horizon dips about 0.48 degrees below level from
  # 75 m.
  bearing_resolution_deg: 10
  elevation_deg:
    - 1.0    # 0    the shore north toward Freshwater Bay
    - 0.5    # 10
    - 0.0    # 20
    - -0.5   # 30   open sea
    - -0.5   # 40
    - -0.5   # 50
    - -0.5   # 60
    - -0.5   # 70
    - -0.5   # 80
    - -0.5   # 90   due east, open Atlantic
    - -0.5   # 100
    - -0.5   # 110
    - -0.5   # 120
    - -0.5   # 130
    - -0.5   # 140
    - -0.5   # 150
    - 0.0    # 160
    - 0.5    # 170  the coast south toward Motion Head
    - 1.5    # 180
    - 2.0    # 190
    - 2.5    # 200
    - 3.0    # 210
    - 3.5    # 220
    - 3.5    # 230
    - 3.0    # 240
    - 3.0    # 250
    - 3.0    # 260
    - 3.0    # 270  due west, the headland rising behind the lighthouse
    - 3.0    # 280
    - 2.5    # 290
    - 2.5    # 300
    - 2.5    # 310
    - 3.0    # 320
    - 3.0    # 330
    - 2.5    # 340
    - 2.0    # 350
terrain_check:
  status: not_run
  dem: null
  tolerance_deg: 1.0
  terrain_elevation_deg: null
  note: >-
    No digital elevation model is available in the repository; the terrain
    check was not run and the terrain horizon is not assumed to agree.
registered:
  date: "2026-09-03"
  by: Tushar Sariya
