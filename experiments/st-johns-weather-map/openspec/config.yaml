schema: spec-driven

context: |
  St. John's / Avalon Peninsula (47.5615, -52.7126) meteorological evidence map.
  A 28-hour window: now-3h through now+24h. Isolated experiment; classification
  is "Experiment, Spec-Impact: none". `operational: false` on every response.

  THE GOVERNING RULE, which outranks every other consideration:
  Nothing is displayed or returned that was not actually retrieved. Missing data
  must be null / unknown / unavailable WITH provenance. Never fabricate, never
  interpolate into a gap, never silently substitute, and never fall back from a
  live failure to a fixture value. "Retrieved" means retrieved by this
  deployment; it does NOT mean the originating producer computed it. A value an
  intermediary transformed before delivering it is still retrieved, and may be
  served, but only from a source the registry declares `reprocessed`, naming
  the producer and the intermediary separately and every documented
  transformation, never as the display primary and never as an input to a
  derivation (owner decision 2026-09-02, so that the foreign global models
  reachable here only through an aggregator are admitted by declaration rather
  than lost or laundered). One owner-approved carve-out, display
  paths only (frame-fallback-and-viewport-layout 2026-08-31; extended by
  scrub-performance-and-motion-interpolation 2026-08-31, by
  multi-frame-cloud-motion 2026-08-31 and by believable-cloud-motion
  2026-08-31): the web map MAY
  draw a neighbouring published frame beyond a layer's staleness tolerance,
  MAY display-composite two retrieved forecast frames under an opt-in
  default-off setting, and for rendered-grid layers MAY draw that composite
  as advection-corrected interpolation - the two retrieved frames warped
  toward each other along a disclosed, precomputed motion field derived
  from the layer's own retrieved frame sequence (the pair's flow, with
  neighbouring adjacent pairs' flows informing C1 Hermite knot velocities),
  endpoint-exact so every real
  frame shows untouched, falling back to linear advection and then to a
  plain linear crossfade where no tangents, no motion or no confidence
  exist - all only with a visible on-map disclosure naming the
  real frame time(s) and method, and never on a data path: /point,
  /features, stories and readings stay frame-exact.
  The motion field MAY additionally be informed by the SAME MODEL RUN's own
  retrieved steering wind at the stratum's pressure level, and by nothing
  else, under every one of these conditions together (believable-cloud-motion
  2026-08-31): the wind only fills cells whose image flow is unsupported and
  never overrides an observed motion; its weight is proportional to its
  agreement with the trusted image flow, so an uncorroborated wind reaches
  nothing; it is refused wherever a well-supported image flow reports the
  field standing still, which is the orographic in-place-development case
  this peninsula lives in; and it is applied at all only for a variable
  whose held-out midpoint reconstruction it measurably improves, with both
  scores published in provenance. A variable whose motion does not beat the
  same construction with its motion reversed is published with a zero
  display weight and crossfades everywhere. That control decides only
  whether MOTION is displayed; methods are ranked against each other and
  any generated term is admitted only on fixed controls.
  Three further sources MAY inform the DISPLAY construction, each fenced the
  same way and each owner-approved (interpolation-method-bench 2026-09-01).
  In all three the pixels drawn stay the layer's own two retrieved frames:
  what crosses is a displacement, a level choice or a timing, never a value.
  (a) That steering wind's LEVEL may be chosen per cell by a retrieved
  observation of the cloud top over that cell - GOES-19 ABI ACHAF cloud-top
  height, and nothing else - under all four conditions above unchanged and
  two more: the observation contributes no motion of its own, only selecting
  which of the same model run's own retrieved 850/700/500 hPa winds a cell
  takes, interpolated at the observed height and clamped at the outermost
  published level, never extrapolated beyond it; and where no valid height
  was retrieved - clear sky, off the observation's grid, a flagged retrieval,
  or a forecast pair with no scan within an hour of it - that cell keeps the
  variable's single steering level exactly, so an absent height is an absent
  height and the construction reduces to the one already permitted.
  (b) The motion field may be informed by a DISPLACEMENT FIELD derived from
  another published retrieved observation - the GOES-19 Enterprise Cloud Mask
  - and by nothing else, under every one of these together: what crosses the
  source boundary is a displacement only, never a value, so no satellite
  pixel is ever composited into a model layer; the transferred motion only
  fills cells whose own image flow is unsupported and never overrides an
  observed motion, because the imagery being drawn is the authority on its
  own motion; its weight is proportional to its agreement with the trusted
  image flow; it is refused wherever a well-supported image flow reports the
  field standing still; it is applied only for a variable whose held-out
  reconstruction it measurably improves, with both scores published; and it
  is absent unless the observed scans exactly span the model pair's interval
  with no gap - nothing is extrapolated, stretched across a hole or taken
  stale, and a pair the scans do not span is disclosed as having no
  transferred prior and falls back to the layer's own motion.
  (c) Vertical-velocity re-timing of the dissolve was retired 2026-09-01 and
  is subsumed by (d), where omega may shift the timing envelope of a computed
  residual.
  (d) GENERATED DISPLAY VALUES (owner decision 2026-09-01, superseding "what
  crosses is a displacement, a level choice or a timing, never a value" for
  display paths only). Between two retrieved frames of one layer, the display
  MAY draw a value that is in neither frame, under every one of these
  together: it is produced by a published, cited physical or statistical
  construction - a computed advection residual, a humidity-to-cloud closure,
  a producer's own documented diagnostic - and by nothing fitted to the
  pictures it produces; it is built the most robust way the literature
  supports, with the evidence for that choice recorded in
  `docs/research/`; it reads only the same model run's own retrieved fields
  and the layer's own retrieved frames; it is zero at both real instants by
  construction, so every retrieved frame still shows untouched; it is bounded
  to the variable's physical range and to a published cap; it is applied only
  for a variable whose held-out reconstruction it measurably improves on a
  FIXED control (a plain crossfade of the same frames, never a control that
  moves with the method), on both mean error and structural similarity, with
  every score published in provenance; the on-map disclosure names it as
  GENERATED and names the construction; it is off by default for the reader
  and can be disabled at three levels - per method in the registry
  (`enabled = False`), per deployment by environment variable
  (`WEATHER_GENERATED_DISPLAY=off`, refusing every generative method at derive
  time), and per reader in the menu; and it never reaches a data path -
  /point, /timeline, /features, stories and readings stay frame-exact.
  A generative construction whose ingredient is absent reduces to the
  permitted advection and says so.
  Every method offered to the reader SHALL declare what it needs in order to
  differ from the default, and an unmet requirement SHALL be shown, because a
  method that silently reduces to another construction is a control that
  appears to do something. A control that appears to do something must
  do it. An empty result that IS the answer ("radar detected nothing") must be
  distinguishable from "we did not retrieve anything".

  Tech stack: FastAPI + Pydantic (StrictModel, extra="forbid"); React 19 +
  TypeScript + Vite + Vitest; MapLibre GL + deck.gl; xarray/Zarr (zipped),
  GeoJSON, Parquet, COG; Postgres/PostGIS + MinIO + titiler under Docker Compose.

  Data modes are explicit end to end: live | fixture | mixed | unavailable. A
  malformed or missing mode fails closed to unavailable. Fixtures are reachable
  only behind `WEATHER_DATA_MODE=fixture` (API) and
  `import.meta.env.DEV && VITE_WEATHER_FIXTURES === 'true'` (web), and are
  watermarked on screen and stamped per field.

  Registry (`registry/source_data.py`) is the canonical catalogue: 63 sources.
  No source is ever `active` - the registry status is a CEILING that a live
  retrieval cannot promote. Promotion requires owner approval plus fixture test,
  live smoke, artifact validation, API readback and provenance checks.

  Hard-won facts. Do not re-derive these, and do not regress them:
  - ECCC GeoMet WMS `GetFeatureInfo` answers ONE PIXEL at one time. It is not a
    field. Layer kind is derived from an artifact's STORED GEOMETRY, never from
    its media type.
  - An unadvertised WMS TIME returns HTTP 200 with `text/xml` carrying
    `ServiceException code="NoMatch"`. Checking the status code alone hands an
    XML blob to the browser as if it were a PNG.
  - WMS 1.3.0 with CRS=EPSG:4326 is LAT,LON axis order. A transposed BBOX is
    answered 200 with a ~96-byte near-empty PNG, silently and with no error.
  - HRDPS and RDPS publish on a ROTATED lat/lon grid, so cfgrib returns 2-D
    `latitude`/`longitude` over anonymous y/x dims. Code assuming 1-D axes breaks.
    This was long misattributed to a numpy/cfgrib version conflict; it never was
    one, and the pins have never been changed.
  - Per-layer time axes at native cadence (radar 6 min, lightning 10 min, METAR
    hourly). A layer publishes `staleness_tolerance_seconds`; within it a frame
    draws quietly, beyond it the web map may show a neighbouring frame only with
    a visible disclosure (observed groups previous-only, never for future
    instants), and with nothing drawable it says why.
  - HRDPS and RDPS relative humidity is over LIQUID WATER at every temperature;
    GFS relative humidity is MIXED-PHASE, a linear ramp from ice at 253.16 K to
    water at 273.16 K. Both were measured from each model's own specific
    humidity, because GRIB2 0/1/1 codes no phase key, and are stamped on the
    field by `ingest/grib.py declare_rh_phase`. A humidity threshold calibrated
    on one model is not transferable to the other below freezing, where GFS
    reads up to ~24 % higher for identical air.
  - GFS pgrb2 publishes total cloud TWICE per lead: instantaneous (PDT 4.0,
    "N hour fcst") and a trailing average (PDT 4.8, "N-M hour ave fcst", a 1 h
    window to f120 and 3 h beyond). Only the instantaneous record is the
    quantity the manifest declares, and the adapter selects it by
    `_INSTANTANEOUS_FORECAST` in `noaa_s3.py`; mixing the two step types in
    one file also makes cfgrib refuse the decode.
  - ECCC's own WEonG total cloud (NT) is temporally smoothed with a
    [0.25, 0.5, 0.25] hourly kernel (technote v2.4.1 sec 7.9), so the
    producer itself treats HRDPS hourly cloud timing as uncertain to about an
    hour. Do not read a one-hour phase difference between frames as a fact.
  - HRDPS `TCDC` and GFS `TCDC` are not the same quantity. HRDPS is
    opacity-weighted, NT = TCC[1 - exp(-0.1(W3 + W4))] with W3/W4 the column
    optical thickness in water and ice, so thin cloud reads near zero; GFS is
    a geometric maximum-random overlap fraction (ccpp-physics `gethml`). Do
    not compare their values, thresholds or scores directly.
  - ECCC IS WITHDRAWING FEEDS FROM DATAMART FASTER THAN THE RESEARCH AGES.
    Three catalogued sources died within three days of being written up: the
    CYYT forecast sounding ranked first in `04-gap-analysis.md`, plus GEPS and
    REPS. Each leaves the same fingerprint - the directory still answers 200
    and contains only `doc/`, while MSC's own readme still documents the dead
    path. Everything that vanished has a GeoMet equivalent, so GeoMet looks
    like where ECCC has moved. Re-probe any `dd.weather.gc.ca` path before
    building against it, however recently it was verified.
  - GEOMET IS THE LARGEST UNTAPPED SOURCE AND THE STACK ALREADY TALKS TO IT.
    Its WCS advertises 6123 coverages, 377 of them HRDPS at 2.5 km, and a WCS
    coverage is a gridded field rather than the single-pixel `GetFeatureInfo`
    answer of the first fact above. It carries what this project most lacks:
    temperature, dew point, humidity and wind at 40, 80 and 120 m (the fog
    layer itself, where the stack currently jumps from 2 m to 1015 hPa),
    relative humidity on 28 pressure levels against the 9 ingested today,
    boundary-layer height, skin temperature for the air-sea difference that
    drives Grand Banks advection fog, and ice cover. Cost per coverage is
    unmeasured and `geomet-wms-access` budgets upstream calls, so measure
    before committing.
  - CONSENSUS WAS UNSATISFIABLE BY CONSTRUCTION, and was removed rather than
    repaired (owner decision 2026-09-02). `point-evidence-sampling` required
    an ensemble among the candidates; `_consensus_candidates` admitted only
    records with `consensus.eligible`; `registry/audit.py` refused eligibility
    to anything that was not `deterministic_forecast`; and `is_ensemble` was
    read from that same category. A candidate had to be eligible to count,
    deterministic to be eligible, and an ensemble to satisfy the gate. The
    branch never once produced a value, and the map's "consensus unavailable"
    badge was reporting an unsatisfiable requirement, not a missing feed. Do
    not reintroduce a blended value: a mean across centres is a value no
    centre issued, it damps the gradients a 2.5 km model exists to resolve,
    and the fields being averaged are frequently not the same quantity. Every
    source that published is shown side by side instead.
  - ENSEMBLES ARE NOT ONE SHAPE. Measured 2026-09-02: `noaa-gefs` publishes 31
    members as per-member GRIB2 on S3 (`gec00` plus `gep01`-`gep30`, control
    self-labelled `ENS=low-res ctl`); `eccc-reps` publishes 21 members as 1239
    individual `REPS.MEM.<VAR>.<NN>` GeoMet coverages, with wind speed but no
    u/v so no direction; `eccc-geps` publishes NO members at all, only its own
    reduction (`ERMEAN`, `ERSSTD`, percentiles `ERC0`-`ERC100`, threshold
    probabilities). Both ECCC ensembles are 404 on every open ECCC HTTP path
    including the one the registry declared, on dd.weather.gc.ca and on the
    hpfx mirror, and MSC's own readme still documents the dead path. A
    provider's own statistic is retrieved evidence and is stored as such;
    never recompute it here and never combine it with a statistic over a
    different member set.
  - NOTHING IN THIS STACK UNDERSTANDS AN ENSEMBLE MEMBER, as of 2026-09-02.
    `ingest/grib.py` drops `number` as an anonymous message scalar, so the
    member identity is deleted at decode and is unrecoverable downstream,
    unlike the time coordinates dropped beside it which the artifact's own
    axes still carry. `_sample_dataset` knows only latitude, longitude, time
    and an optional pressure coordinate; a member array reaches `float()`,
    raises, is caught, and becomes None - a silent loss where the same
    function already refuses an unrequested pressure DIMENSION outright four
    lines earlier. `Provenance.member` exists and no adapter has ever set it.
  - GEFS TOTAL CLOUD IS A SIX-HOUR AVERAGE (`TCDC:entire atmosphere:0-6 hour
    ave fcst` in the `pgrb2a` inventory), one product further along the same
    trap as GFS's PDT 4.0 vs 4.8 duplicates. Do not draw it beside the
    instantaneous HRDPS or GFS field. Whether `pgrb2b` carries an
    instantaneous record is unverified.
  - GOOGLE WEATHERNEXT 2 PUBLISHES NO CLOUD VARIABLE. Verified band list
    2026-09-02: 2 m temperature, 10 m and 100 m winds, MSLP, SST, 6-hourly
    precipitation, and geopotential, specific humidity, temperature, u, v and
    vertical velocity on 50-1000 hPa. Any "cloud cover" a reseller advertises
    for it is that reseller's own humidity closure, not model output, and
    would be a GENERATED value under carve-out (d) rather than provider
    output. Its licence also splits on VALID TIME, not run age: only data
    relating to a time more than 48 hours ago is CC BY 4.0, so every
    forward-looking value sits in the restricted real-time terms.
  - A derived artifact is kept off the data paths by its provenance flags
    (`derived` / `generated`), never by matching its logical name. The name
    match in `LiveStore.sample_point` stopped covering the motion artifact the
    moment its name grew a layer suffix, and it never covered the generated
    WEonG repair at all - which put generated cloud values into /point and
    /profile, against carve-out (d), and then failed the WHOLE response,
    because a derivation records its own QC status and `derived` is not one of
    the four the evidence contract allows (passed/suspect/failed/unknown). One
    artifact with an unmodelled field takes down every source in the
    response: `live_provenance` is not isolated per artifact the way `open`
    is.

rules:
  proposal:
    - State plainly what evidence exists for the change and what remains unverified.
    - Never propose displaying a value the system cannot actually retrieve.
  specs:
    - Every requirement about displayed data must say what happens when the data
      is absent, not only when it is present.
    - Prefer scenarios that pin fail-closed behaviour; a green path alone is not
      sufficient for this project.
  tasks:
    - Name the exact verification command for each task.
    - Call out which files are owned, since work here is often parallelised
      across agents with disjoint ownership.

operations:
  apply:
    guidance:
      - Do not weaken validation, QC or completeness checks to make a test pass.
      - Report partial success precisely; an overstated claim is worse than a gap.
  archive:
    guidance:
      - Archive only after the verification commands in tasks.md have actually run.
