schema: spec-driven

context: |
  St. John's / Avalon Peninsula (47.5615, -52.7126) meteorological evidence map.
  A 28-hour window: now-3h through now+24h. Isolated experiment; classification
  is "Experiment, Spec-Impact: none". `operational: false` on every response.

  THE GOVERNING RULE, which outranks every other consideration:
  Nothing is displayed or returned that was not actually retrieved. Missing data
  must be null / unknown / unavailable WITH provenance. Never fabricate, never
  interpolate into a gap, never silently substitute, and never fall back from a
  live failure to a fixture value. One owner-approved carve-out, display
  paths only (frame-fallback-and-viewport-layout 2026-08-31; extended by
  scrub-performance-and-motion-interpolation 2026-08-31, by
  multi-frame-cloud-motion 2026-08-31 and by believable-cloud-motion
  2026-08-31): the web map MAY
  draw a neighbouring published frame beyond a layer's staleness tolerance,
  MAY display-composite two retrieved forecast frames under an opt-in
  default-off setting, and for rendered-grid layers MAY draw that composite
  as advection-corrected interpolation - the two retrieved frames warped
  toward each other along a disclosed, precomputed motion field derived
  from the layer's own retrieved frame sequence (the pair's flow, with
  neighbouring adjacent pairs' flows informing C1 Hermite knot velocities),
  endpoint-exact so every real
  frame shows untouched, falling back to linear advection and then to a
  plain linear crossfade where no tangents, no motion or no confidence
  exist - all only with a visible on-map disclosure naming the
  real frame time(s) and method, and never on a data path: /point,
  /features, stories and readings stay frame-exact.
  The motion field MAY additionally be informed by the SAME MODEL RUN's own
  retrieved steering wind at the stratum's pressure level, and by nothing
  else, under every one of these conditions together (believable-cloud-motion
  2026-08-31): the wind only fills cells whose image flow is unsupported and
  never overrides an observed motion; its weight is proportional to its
  agreement with the trusted image flow, so an uncorroborated wind reaches
  nothing; it is refused wherever a well-supported image flow reports the
  field standing still, which is the orographic in-place-development case
  this peninsula lives in; and it is applied at all only for a variable
  whose held-out midpoint reconstruction it measurably improves, with both
  scores published in provenance. A variable whose motion does not beat the
  same construction with its motion reversed is published with a zero
  display weight and crossfades everywhere.
  Three further sources MAY inform the DISPLAY construction, each fenced the
  same way and each owner-approved (interpolation-method-bench 2026-09-01).
  In all three the pixels drawn stay the layer's own two retrieved frames:
  what crosses is a displacement, a level choice or a timing, never a value.
  (a) That steering wind's LEVEL may be chosen per cell by a retrieved
  observation of the cloud top over that cell - GOES-19 ABI ACHAF cloud-top
  height, and nothing else - under all four conditions above unchanged and
  two more: the observation contributes no motion of its own, only selecting
  which of the same model run's own retrieved 850/700/500 hPa winds a cell
  takes, interpolated at the observed height and clamped at the outermost
  published level, never extrapolated beyond it; and where no valid height
  was retrieved - clear sky, off the observation's grid, a flagged retrieval,
  or a forecast pair with no scan within an hour of it - that cell keeps the
  variable's single steering level exactly, so an absent height is an absent
  height and the construction reduces to the one already permitted.
  (b) The motion field may be informed by a DISPLACEMENT FIELD derived from
  another published retrieved observation - the GOES-19 Enterprise Cloud Mask
  - and by nothing else, under every one of these together: what crosses the
  source boundary is a displacement only, never a value, so no satellite
  pixel is ever composited into a model layer; the transferred motion only
  fills cells whose own image flow is unsupported and never overrides an
  observed motion, because the imagery being drawn is the authority on its
  own motion; its weight is proportional to its agreement with the trusted
  image flow; it is refused wherever a well-supported image flow reports the
  field standing still; it is applied only for a variable whose held-out
  reconstruction it measurably improves, with both scores published; and it
  is absent unless the observed scans exactly span the model pair's interval
  with no gap - nothing is extrapolated, stretched across a hole or taken
  stale, and a pair the scans do not span is disclosed as having no
  transferred prior and falls back to the layer's own motion.
  (c) The dissolve between two retrieved frames may be re-timed by the SAME
  MODEL RUN's own retrieved vertical velocity at the stratum's pressure
  level, and by nothing else, under every one of these together: the
  re-timing is a monotone reparameterisation of the mixing fraction that is
  zero at both real instants by construction rather than by a clamp, so every
  real frame still shows untouched; it is bounded so the displayed value
  stays a convex combination of the two retrieved frames at that same cell,
  adding no cloud that is in neither and removing none that is in both - the
  vertical velocity decides only WHEN the change between two retrieved values
  is delivered, never what that change is; it reaches the display only in
  proportion to how far advection has already failed to explain the change,
  so wherever the imagery shows motion the motion wins; and it is applied
  only for a variable whose held-out reconstruction it measurably improves,
  with both scores published in provenance.
  Every method offered to the reader SHALL declare what it needs in order to
  differ from the default, and an unmet requirement SHALL be shown, because a
  method that silently reduces to another construction is a control that
  appears to do something. A control that appears to do something must
  do it. An empty result that IS the answer ("radar detected nothing") must be
  distinguishable from "we did not retrieve anything".

  Tech stack: FastAPI + Pydantic (StrictModel, extra="forbid"); React 19 +
  TypeScript + Vite + Vitest; MapLibre GL + deck.gl; xarray/Zarr (zipped),
  GeoJSON, Parquet, COG; Postgres/PostGIS + MinIO + titiler under Docker Compose.

  Data modes are explicit end to end: live | fixture | mixed | unavailable. A
  malformed or missing mode fails closed to unavailable. Fixtures are reachable
  only behind `WEATHER_DATA_MODE=fixture` (API) and
  `import.meta.env.DEV && VITE_WEATHER_FIXTURES === 'true'` (web), and are
  watermarked on screen and stamped per field.

  Registry (`registry/source_data.py`) is the canonical catalogue: 59 sources.
  No source is ever `active` - the registry status is a CEILING that a live
  retrieval cannot promote. Promotion requires owner approval plus fixture test,
  live smoke, artifact validation, API readback and provenance checks.

  Hard-won facts. Do not re-derive these, and do not regress them:
  - ECCC GeoMet WMS `GetFeatureInfo` answers ONE PIXEL at one time. It is not a
    field. Layer kind is derived from an artifact's STORED GEOMETRY, never from
    its media type.
  - An unadvertised WMS TIME returns HTTP 200 with `text/xml` carrying
    `ServiceException code="NoMatch"`. Checking the status code alone hands an
    XML blob to the browser as if it were a PNG.
  - WMS 1.3.0 with CRS=EPSG:4326 is LAT,LON axis order. A transposed BBOX is
    answered 200 with a ~96-byte near-empty PNG, silently and with no error.
  - HRDPS and RDPS publish on a ROTATED lat/lon grid, so cfgrib returns 2-D
    `latitude`/`longitude` over anonymous y/x dims. Code assuming 1-D axes breaks.
    This was long misattributed to a numpy/cfgrib version conflict; it never was
    one, and the pins have never been changed.
  - Per-layer time axes at native cadence (radar 6 min, lightning 10 min, METAR
    hourly). A layer publishes `staleness_tolerance_seconds`; within it a frame
    draws quietly, beyond it the web map may show a neighbouring frame only with
    a visible disclosure (observed groups previous-only, never for future
    instants), and with nothing drawable it says why.

rules:
  proposal:
    - State plainly what evidence exists for the change and what remains unverified.
    - Never propose displaying a value the system cannot actually retrieve.
  specs:
    - Every requirement about displayed data must say what happens when the data
      is absent, not only when it is present.
    - Prefer scenarios that pin fail-closed behaviour; a green path alone is not
      sufficient for this project.
  tasks:
    - Name the exact verification command for each task.
    - Call out which files are owned, since work here is often parallelised
      across agents with disjoint ownership.

operations:
  apply:
    guidance:
      - Do not weaken validation, QC or completeness checks to make a test pass.
      - Report partial success precisely; an overstated claim is worse than a gap.
  archive:
    guidance:
      - Archive only after the verification commands in tasks.md have actually run.
