<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#07151C" />
    <meta name="description" content="Experimental meteorological evidence workbench for the Avalon Peninsula." />
    <title>Avalon Weather Evidence Desk</title>
    <script>
      (() => {
        let stored
        try { stored = localStorage.getItem('astraeus-weather-theme') } catch { /* optional preference */ }
        const theme = stored === 'light' || stored === 'dark' || stored === 'night'
          ? stored
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme === 'light' ? 'light' : 'dark'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
