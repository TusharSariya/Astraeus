name: Bug report
description: Report behavior that differs from an accepted requirement.
title: "fix: "
labels: [bug]
body:
  - type: input
    id: spec_refs
    attributes:
      label: Violated requirement IDs
      description: Use "unknown" if specification triage is needed.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior and evidence
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction, environment, revision, and source freshness
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety or incorrect-recommendation impact
    validations:
      required: true
